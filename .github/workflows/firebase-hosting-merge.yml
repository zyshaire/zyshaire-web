name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FORMSPREE_CONTACT_FORM_ID: ${{ vars.VITE_FORMSPREE_CONTACT_FORM_ID }}
      VITE_FORMSPREE_NEWSLETTER_FORM_ID: ${{ vars.VITE_FORMSPREE_NEWSLETTER_FORM_ID }}
      VITE_FORMSPREE_AUDIT_FORM_ID: ${{ vars.VITE_FORMSPREE_AUDIT_FORM_ID }}

    steps:
      - uses: actions/checkout@v4
      - run: cd website && npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZYSHAIRE_WEB }}
          channelId: live
          projectId: zyshaire-web
          entryPoint: website
